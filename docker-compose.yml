version: "3.8"
services:
  redis:
    image: redis:8.0.2
    container_name: redis
    ports:
      - "6379:6379"

  blue: # TO DO: 토의 후 이름 변경 및 서버 분리할지 결정
    image: ${DOCKER_USERNAME}/bongbaek-server:latest
    container_name: bongbaek-blue-server
    ports:
      - "8080:8080"
    depends_on:
      - redis

  green:
    image: ${DOCKER_USERNAME}/bongbaek-server:latest
    container_name: bongbaek-green-server
    ports:
      - "8081:8080"
    depends_on:
      - redis

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"
    environment:
      DOZZLE_USERNAME: ${DOZZLE_USERNAME}
      DOZZLE_PASSWORD: ${DOZZLE_PASSWORD}
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - blue
      - green
