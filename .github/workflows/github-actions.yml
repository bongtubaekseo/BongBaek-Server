name: Bongbaek CI with github actions & docker

on:
  # 배포 테스트
  workflow_dispatch:

  push:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-latest

    env:
      HOST: ${{ github.ref == 'refs/heads/main' && secrets.HOST || secrets.TEST_HOST }}
      SSH_PRIVATE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SSH_PRIVATE_KEY || secrets.TEST_SSH_PRIVATE_KEY }}
      APPLICATION: ${{ github.ref == 'refs/heads/main' && secrets.APPLICATION || secrets.TEST_APPLICATION }}
      MY_CNF: ${{ github.ref == 'refs/heads/main' && secrets.MY_CNF || secrets.TEST_MY_CNF }}

    steps:
      # GitHub Actions Runner로 repository 내용을 복사
      - uses: actions/checkout@v4

      # 빌드를 위한 jdk21 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 빌드 성능 향상을 위한 Gradle 캐싱
      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 빌드에 필요한 리소스 파일 생성 및 작성
      - name: Generate application.yml & my.cnf
        run: |
          mkdir -p ./src/main/resources
          touch ./src/main/resources/application.yml
          printf '%s' "${{ env.APPLICATION }}" > ./src/main/resources/application.yml
          touch ./my.cnf
          printf '%s' "${{ env.MY_CNF }}" > ./my.cnf

        shell: bash

      # 빌드 수행(테스트 제외)
      - name: Build with gradle
        run: ./gradlew build -x test

      # 멀티플랫폼 빌드를 위한 QEMU 세팅
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # 도커 이미지 빌드를 위한 buildX 세팅
      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      # 도커 이미지 업로드를 위한 로그인
      - name: Docker Login
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # 도커 이미지를 빌드하고 도커 허브에 업로드
      - name: Docker image build & push
        run: |
          docker buildx build \
          --platform linux/amd64 \
          --push \
          -t ${{ secrets.DOCKER_USERNAME }}/bongbaek-server .

      # 디렉토리 사전 생성
      - name: Ensure remote dir
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.HOST }}
          username: ubuntu
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/bongbaek-server

      # docker-compose.yml 및 nginx와 배포.sh 업로드
      - name: Upload docker-compose
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.HOST }}
          username: ubuntu
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: "./docker-compose.yml, ./proxy, ./deploy.sh, ./prometheus.yml, ./my.cnf"
          target: "/home/ubuntu/bongbaek-server"
          rm: true

      # EC2에 ssh 접속 후
      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.HOST }}
          username: ubuntu
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/bongbaek-server

            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            
            export DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}

            export DOZZLE_USERNAME=${{ secrets.DOZZLE_USERNAME }}

            export DOZZLE_PASSWORD=${{ secrets.DOZZLE_PASSWORD }}
            
            chmod +x deploy.sh
            ./deploy.sh
