global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bongbaek monitor'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'bongbaek1:8080'
          - 'bongbaek2:8080'

  - job_name: 'mysqld_exporter'
    static_configs:
      - targets:
          - 'mysqld_exporter:9104'

  - job_name: 'nginx-exporter'
    static_configs:
      - targets:
          - 'nginx-exporter:9113'

  - job_name: 'redis-exporter'
    static_configs:
      - targets:
          - 'redis_exporter:9121'
