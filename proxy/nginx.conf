worker_processes auto;

events {
    worker_connections  1024;
    multi_accept on;
    use epoll;
}

http { # 이후 JWT 캐싱을 위해 L7 통신 사용
    client_max_body_size 10M;

    upstream bongbaek_server {
        least_conn;
        server bongbaek1:8080 max_fails=3 fail_timeout=10s;
        server bongbaek2:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;   # 연결 재사용
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://bongbaek_server;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            # 실패 시 다른 upstream으로 재시도
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 3s;   # 연결 시도 제한 시간
            proxy_read_timeout 20s;     # 응답 대기 시간

            # 응답 버퍼 설정
            proxy_buffering on;
            proxy_buffers 8 8k;
            proxy_busy_buffers_size 16k;
        }

        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.0.0.0/8;   # 도커 브리지 네트워크 대역
            deny all;
        }
    }
}
